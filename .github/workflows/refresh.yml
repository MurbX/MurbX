name: Refresh profile cards

on:
  schedule:
    # Every 6 hours. Cron on GitHub is best-effort — a late run is normal.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'profile.config.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PROFILE_TOKEN is a PAT with `repo` scope — it is what makes private and
      # org contributions visible. Without it the cards would be re-rendered from
      # public repos only and lose most of the numbers, so the render is skipped
      # and the committed cards stay as they are.
      - name: Check for PROFILE_TOKEN
        id: token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -n "$PROFILE_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::PROFILE_TOKEN secret is not set; skipping render so private work isn't dropped from the cards."; fi

      - name: Render cards
        if: steps.token.outputs.present == 'true'
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/render.mjs

      - name: Commit if changed
        if: steps.token.outputs.present == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No change in generated cards."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
